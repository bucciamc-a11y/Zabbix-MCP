[project]
name = "zabbix-mcp"
version = "0.1.0"
description = "MCP server exposing the Zabbix 7.4 API to LLM clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
zabbix-mcp = "zabbix_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zabbix_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "B006", "E501"]
